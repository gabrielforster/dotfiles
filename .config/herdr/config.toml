onboarding = false
# ~/.config/herdr/config.toml
# Ported from .tmux.conf — herdr 0.7.5 key names
# Reload after editing: herdr server reload-config

[keys]
prefix = "ctrl+b"

# Navigate mode: vim motions walk the sidebar workspace list.
# Vertical pane movement moves to the arrows that workspaces gave up.
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
navigate_pane_up        = "up"
navigate_pane_down      = "down"

# prefix+[ into copy mode, as in tmux
copy_mode = "prefix+["

# base-index 1 equivalent: tab jumps are 1-based
switch_tab = "prefix+1..9"

[ui]
# set -g mouse on
mouse_capture = true
copy_on_select = true

show_agent_labels_on_pane_borders = true
[theme]
name = "catppuccin"

[ui.toast]
delivery = "system"
